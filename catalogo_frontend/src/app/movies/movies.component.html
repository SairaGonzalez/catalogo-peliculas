<div class="container-fluid mt-4 px-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 titulo-peliculas">Catálogo de películas</h2>
    <a [routerLink]="['/agregar']" class="btn btn-success">
      Agregar película
    </a>
  </div>
  <div class="row g-4">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let pelicula of peliculas"
    >
      <div class="movie-card h-100 text-center">
        <a [routerLink]="['/movie', pelicula.id]">
          <img [src]="pelicula.cover" class="movie-img img-fluid" />
        </a>
        <div class="mt-3">
          <a
            [routerLink]="['/movie', pelicula.id]"
            class="movie-title text-decoration-none"
            >{{ pelicula.title }}</a
          >
        </div>

        <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">
          <a
            [routerLink]="['/editar', pelicula.id]"
            class="btn btn-sm btn-secondary"
            >Editar</a
          >
          <button
            (click)="eliminar(pelicula.id!)"
            class="btn btn-sm btn-danger"
          >
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
